name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy python-docx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -p 'test*.py' -v

    - name: Validate submission revision (smoke)
      run: |
        python validate_submission_revision.py --mode smoke --output-root results/submission_revision --expected-repeats 1

    - name: Validate release artifacts
      run: |
        python validate_release_artifacts.py
